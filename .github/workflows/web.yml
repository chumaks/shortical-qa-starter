name: web

on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * *' # daily production check
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Offline gate: types, ESLint, project rules, linter selftest,
      # spec compilation, Android config. Same command as the pre-commit hook.
      - run: npm run verify

      - run: npx playwright install --with-deps chrome
      - run: npm run test:web

      - name: summary
        if: ${{ !cancelled() }}
        run: npm run --silent summary >> "$GITHUB_STEP_SUMMARY"

      # A green exit code is not enough: fail the job if nothing ran or tests
      # were skipped. Prints PASS / FAIL / NOT-EARNED with counts.
      - name: earned
        if: ${{ !cancelled() }}
        run: npm run earned

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-report
          path: |
            artifacts/web-report
            artifacts/web-results.json
          retention-days: 14
